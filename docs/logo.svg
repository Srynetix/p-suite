<!-- The P suite's logo: a P filled with the suite's gradient, orange to violet to blue. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="P suite">
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset=".5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="#161327"/>
  <path fill="url(#p)" fill-rule="evenodd"
        d="M 250 180 H 560 A 250 250 0 0 1 560 680 H 440 V 844 H 250 Z M 440 340 V 520 H 540 A 90 90 0 0 0 540 340 Z"/>
</svg>
